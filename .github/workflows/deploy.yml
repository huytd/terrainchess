name: Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_1E09Ltsrj01bNThfJLseMkCY
  VERCEL_PROJECT_ID: prj_4lnO87H0WR7N3NOb9bzEKBcYUdAf
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          cache-on-failure: true

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Run native tests
        run: cargo test -p tc_core -p tc_ai -p tc_run

      - name: Build web release
        run: |
          cd web
          trunk build --release

      - name: Skip deploy notice
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "::notice::VERCEL_TOKEN is not configured; deploy was skipped."

      - name: Deploy to Vercel
        id: deploy
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: web/dist
        run: |
          DEPLOY_ARGS=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_ARGS="--prod"
          fi
          DEPLOY_OUTPUT=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" $DEPLOY_ARGS)
          # Non-interactive CLI prints JSON; older versions print just the URL.
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | jq -r '.deployment.url // empty' 2>/dev/null || true)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^" ,]+\.vercel\.app' | head -n 1)
          fi
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not find the deployment URL in the Vercel output"
            echo "$DEPLOY_OUTPUT"
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"

      - name: Comment PR Preview
        if: ${{ env.VERCEL_TOKEN != '' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            const deployUrl = process.env.DEPLOY_URL;
            const issueNumber = context.payload.pull_request?.number || context.issue.number;

            const body = [
              marker,
              '### 🎮 Terrain Chess Preview',
              '',
              `| Environment | Status | Preview | Commit |`,
              `| :--- | :--- | :--- | :--- |`,
              `| **Preview** | Ready | [Visit Preview](${deployUrl}) | \`${sha.substring(0, 7)}\` |`,
              '',
              `**Preview URL:** ${deployUrl}`,
              `**Commit:** ${sha}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body,
              });
            }

      - name: Print production URL to job summary
        if: ${{ env.VERCEL_TOKEN != '' && github.ref == 'refs/heads/main' }}
        run: |
          echo "### 🚀 Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The web game has been deployed to production:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Production URL:** [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
