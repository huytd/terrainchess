<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1c2c" />
    <title>Terrain Chess</title>
    <link rel="preload" href="assets/atlas.png" as="image" />
    <link data-trunk rel="rust" href="../crates/game/Cargo.toml" data-bin="terrainchess" data-cargo-profile="wasm-release" data-wasm-opt="z" data-wasm-opt-params="--all-features" data-initializer="loader.js" />
    <!-- Only the processed atlas ships; the source sheet stays out of the build. -->
    <link data-trunk rel="copy-file" href="../assets/atlas.png" data-target-path="assets" />
    <!-- The game's two fonts, so the loading screen matches the in-game UI. -->
    <link data-trunk rel="copy-file" href="../assets/fonts/Jacquard24-Regular.ttf" data-target-path="assets/fonts" />
    <link data-trunk rel="copy-file" href="../assets/fonts/Handjet-Medium.ttf" data-target-path="assets/fonts" />
    <link rel="preload" href="assets/fonts/Jacquard24-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/fonts/Handjet-Medium.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face { font-family: "Jacquard 24"; src: url("assets/fonts/Jacquard24-Regular.ttf") format("truetype"); font-display: block; }
      @font-face { font-family: "Handjet"; src: url("assets/fonts/Handjet-Medium.ttf") format("truetype"); font-display: block; }
      html, body {
        margin: 0; height: 100%; background: #1a1c2c; overflow: hidden;
        /* Mobile: no page scroll, bounce, text selection or tap flash; the game handles touch. */
        overscroll-behavior: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { position: fixed; inset: 0; height: 100dvh; }
      #bevy { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #loading {
        position: fixed; inset: 0; z-index: 99999; background: #1a1c2c;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: "Handjet", monospace; color: #e9dab2;
        transition: opacity 300ms ease;
      }
      .loading-title {
        color: #e9dab2; font-family: "Jacquard 24", serif; font-size: 48px; font-weight: normal;
        letter-spacing: 1px; margin-bottom: 24px; text-align: center;
      }
      .loading-bar-track {
        width: 90%; max-width: 320px; height: 20px;
        background: #11121c; border: 2px solid #e9dab2;
        box-sizing: border-box; position: relative; overflow: hidden;
        margin-bottom: 12px;
      }
      #loading-bar-fill {
        height: 100%; width: 0%; background: #d4a347;
      }
      #loading-bar-fill.indeterminate {
        position: absolute; top: 0; bottom: 0; width: 35%;
        animation: indeterminate 1.5s infinite ease-in-out;
      }
      @keyframes indeterminate {
        0% { left: -35%; }
        50% { left: 50%; }
        100% { left: 100%; }
      }
      #loading-status {
        color: #e9dab2; font-family: "Handjet", monospace; font-size: 22px;
        text-align: center; min-height: 1.2em;
      }
    </style>
    <script>
      window.terrainchessReady = function () {
        const overlay = document.getElementById('loading');
        if (!overlay) return;
        overlay.style.pointerEvents = 'none';
        overlay.style.opacity = '0';
        setTimeout(function () {
          overlay.remove();
        }, 300);
      };

      window.terrainchessStatus = function (text) {
        const status = document.getElementById('loading-status');
        if (status) {
          status.textContent = text;
          if (/fail/i.test(text)) {
            status.style.color = '#ff5555';
          }
        }
      };
    </script>
  </head>
  <body>
    <canvas id="bevy" oncontextmenu="return false"></canvas>
    <div id="loading">
      <div class="loading-title">Terrain Chess</div>
      <div class="loading-bar-track">
        <div id="loading-bar-fill"></div>
      </div>
      <div id="loading-status"></div>
    </div>
  </body>
</html>
