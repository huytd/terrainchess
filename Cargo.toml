[workspace]
resolver = "3"
members = ["crates/core", "crates/ai", "crates/run", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tc_core = { path = "crates/core" }
tc_ai = { path = "crates/ai" }
tc_run = { path = "crates/run" }
# Only what the 3D board needs: no UI, text, picking, audio or gamepads, to keep the web
# build small.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_image",
    "png",
    "webgl2",
    "x11",
    "wayland",
] }
noise = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Bevy is slow unoptimised; optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Web release builds: small over fast (see PLAN.md M8).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
